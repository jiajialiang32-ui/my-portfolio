<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makayla's Portfolio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#1a100a] text-[#421f06] overflow-hidden m-0 p-0 select-none flex flex-col h-screen">

    <div id="loading-screen" class="fixed inset-0 bg-[#1a100a] z-[100] flex items-center justify-center">
        <div class="text-white text-4xl font-vt323">Loading...</div>
    </div>

    <div id="start-screen" class="hidden fixed inset-0 bg-[#1a100a] z-[99] flex flex-col items-center justify-center text-center p-4">
        <h1 class="text-5xl md:text-6xl text-white font-vt323 mb-4">Makayla's Portfolio</h1>
        <p class="text-xl md:text-2xl text-white font-vt323 mb-8">Click to start your adventure!</p>
        <button id="start-btn" class="stardew-tab-btn px-8 py-4 text-3xl font-bold">ENTER</button>
    </div>

    <header class="w-full bg-[#f3d9a4] border-b-8 border-[#5c2e0b] shadow-[0_4px_0_rgba(0,0,0,0.15)] p-2 sm:p-3 md:p-4 flex flex-row md:flex-row items-center justify-between gap-2 md:gap-4 z-30 shrink-0">
        <div class="flex items-center gap-2 sm:gap-3 min-w-0 flex-1">
            <div class="px-2 py-1 sm:px-3 sm:py-2 bg-[#b97235] text-[#fffdf9] border-4 border-[#421f06] shadow-[4px_4px_0px_0px_rgba(0,0,0,0.2)] shrink-0">
                <h1 class="text-[0.7rem] sm:text-sm md:text-4xl font-bold tracking-wider leading-none">MAKAYLA'S PORTFOLIO</h1>
            </div>
            <div class="relative shrink-0">
                <button id="sound-btn" class="stardew-tab-btn px-2 py-1 text-[0.7rem] sm:text-sm md:text-xl font-bold" title="Toggle Sound">SOUND</button>
                <div id="sound-menu" class="hidden absolute right-0 top-full mt-2 z-50 w-32 sm:w-40">
                    <button id="music-toggle" class="sound-option-btn w-full">Music: ON</button>
                    <button id="effect-toggle" class="sound-option-btn w-full">Effect: ON</button>
                </div>
            </div>
        </div>

        <nav class="flex flex-nowrap items-center gap-1 md:gap-3 overflow-x-auto max-w-full shrink-0">
            <button onclick="openModal('about')" class="stardew-tab-btn px-2 py-1 text-[0.65rem] sm:text-sm md:text-2xl font-bold whitespace-nowrap">ABOUT ME</button>
            <button onclick="openModal('skills')" class="stardew-tab-btn px-2 py-1 text-[0.65rem] sm:text-sm md:text-2xl font-bold whitespace-nowrap">SKILLS</button>
            <button onclick="openModal('projects')" class="stardew-tab-btn px-2 py-1 text-[0.65rem] sm:text-sm md:text-2xl font-bold whitespace-nowrap">PROJECTS</button>
            <button onclick="openModal('contact')" class="stardew-tab-btn px-2 py-1 text-[0.65rem] sm:text-sm md:text-2xl font-bold whitespace-nowrap">CONTACT</button>
        </nav>
    </header>

    <main id="interactive-mode" class="flex-1 w-full relative bg-[#6fa1ff]">
        <canvas id="gameCanvas" class="w-full h-full block"></canvas>

        <div class="absolute left-3 bottom-30 sm:left-4 sm:bottom-2 z-40 md:hidden">
            <div id="joystick-base" class="joystick-base">
                <div id="joystick-knob" class="joystick-knob"></div>
            </div>
        </div>
        
        <div id="interaction-prompt" class="hidden fixed bottom-20 left-1/2 transform -translate-x-1/2 stardew-container px-4 py-2 text-lg md:px-6 md:py-3 md:text-2xl font-bold text-center z-40 animate-bounce">
            Press [SPACE] to Open
        </div>


    </main>

    <div id="modal-overlay" class="hidden fixed inset-0 bg-black/60 z-50 items-center justify-center p-4 transition-all duration-200">
        <div id="modal-content" class="stardew-container w-full max-w-3xl p-6 md:p-8 relative transform scale-90 opacity-0 transition-all duration-300 max-h-[90vh] overflow-hidden">
            <button id="modal-close" class="absolute -top-3 -right-3 w-10 h-10 bg-[#9c2a2a] border-4 border-[#421f06] font-bold text-white flex items-center justify-center cursor-pointer shadow-md text-xl hover:bg-[#bd3a3a]">X</button>
            <div id="modal-body" class="text-[#421f06] text-2xl leading-relaxed"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
